name: browsers
on:
  push:
    branches: [fable]
    paths: ['src/**', 'styles/**', 'index.html', 'tests/**', 'playwright.config.js', '.github/workflows/browsers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-report.json PLAYWRIGHT_HTML_OPEN=never npx playwright test --project=${{ matrix.browser }} --reporter=list,json,html --trace=retain-on-failure 2>&1 | tee browser.log
          code=${PIPESTATUS[0]}
          sh scripts/ci-annotate.sh "${{ matrix.browser }} totals" browser.log -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)'
          grep -E '^ +✘' browser.log | sed -E 's/^ +✘ +[0-9]+ \[[a-z]+\] › //' | sort -u > failures.log
          sh scripts/ci-annotate.sh "${{ matrix.browser }} failing tests" failures.log -E '.'
          awk '/^ +[0-9]+\) \[/ {n=0} n<12 {print; n++}' browser.log > details.log
          sh scripts/ci-annotate.sh "${{ matrix.browser }} failure details" details.log -E '.'
          BROWSER_NAME="${{ matrix.browser }}" node - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const fs = require('node:fs');
          const name = process.env.BROWSER_NAME;
          if (!fs.existsSync('playwright-report.json')) {
            console.log(`## ${name}\n\nNo report was written.`);
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync('playwright-report.json', 'utf8'));
          const clean = (text) => String(text || '').replace(/\u001b\[[0-9;]*m/g, '');
          const cell = (text) => clean(text).replace(/\|/g, '\\|').replace(/\s+/g, ' ').trim();
          const failed = [];
          const walk = (suite) => {
            for (const spec of suite.specs || []) {
              for (const t of spec.tests || []) {
                const last = t.results[t.results.length - 1];
                if (!last || ['passed', 'skipped'].includes(last.status)) continue;
                const err = (last.error && last.error.message) || (last.errors && last.errors[0] && last.errors[0].message) || last.status;
                const first = clean(err).split('\n').map((l) => l.trim()).find((l) => l) || last.status;
                failed.push({ file: spec.file, line: spec.line, title: spec.title, first });
              }
            }
            for (const child of suite.suites || []) walk(child);
          };
          for (const suite of report.suites || []) walk(suite);
          const st = report.stats || {};
          console.log(`## ${name}: ${failed.length} failed, ${st.expected || 0} passed, ${st.flaky || 0} flaky, ${st.skipped || 0} skipped\n`);
          if (failed.length) {
            console.log('| File | Line | Test | First error line |\n|---|---|---|---|');
            for (const f of failed) console.log(`| tests/${cell(f.file)} | ${f.line} | ${cell(f.title)} | ${cell(f.first)} |`);
          }
          EOF
          exit $code
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-results
          path: |
            test-results
            playwright-report
            playwright-report.json
          if-no-files-found: ignore
