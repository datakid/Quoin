name: browsers
on:
  push:
    branches: [fable]
    paths: ['src/**', 'styles/**', 'index.html', 'tests/**', 'playwright.config.js', '.github/workflows/browsers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        run: |
          set +e
          npx playwright test --project=${{ matrix.browser }} 2>&1 | tee browser.log
          code=${PIPESTATUS[0]}
          sh scripts/ci-annotate.sh "${{ matrix.browser }} totals" browser.log -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)'
          grep -E '^ +✘' browser.log | sed -E 's/^ +✘ +[0-9]+ \[[a-z]+\] › //' | sort -u > failures.log
          sh scripts/ci-annotate.sh "${{ matrix.browser }} failing tests" failures.log -E '.'
          awk '/^ +[0-9]+\) \[/ {n=0} n<12 {print; n++}' browser.log > details.log
          sh scripts/ci-annotate.sh "${{ matrix.browser }} failure details" details.log -E '.'
          exit $code
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-results
          path: test-results
          if-no-files-found: ignore
